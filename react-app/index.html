<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booknest Books – Online Bookstore</title>
  <meta name="description" content="Browse live book listings with real covers, search, wishlist and checkout at Booknest Books.">
  <script>
    // Apply saved/preferred theme before first paint to avoid a flash
    (function () {
      try {
        var t = localStorage.getItem('pagewise-theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
